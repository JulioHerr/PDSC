---
layout: default
---
<style>
  .lateral {
    position: fixed;
    top: 0;
    bottom: 0;
    width: 20vw;
    padding: 5rem 1rem 1rem;
    overflow-y: auto;
    box-sizing: border-box;
    font-size: 0.8rem;
  }
  .lateral.izq { left: 0; }
  .lateral.der { right: 0; }
  .lateral pre { white-space: pre-wrap; font-size: 0.72rem; }

    body a.btn {
    display: inline-block;
    margin: 0.3rem 0.4rem 0.3rem 0;
    padding: 0.7rem 1.4rem;
    background: #b9573f;
    color: #fff;
    font-size: 1.1rem;
    text-decoration: none;
    border: 3px solid #2b2b2b;
    border-radius: 10px;
    box-shadow: 0 2px 0 rgba(0, 0, 0, 0.25);
    transition: background 0.15s, transform 0.15s;
  }
  body a.btn:hover {
    background: #c9654b;
    color: #fff;
    transform: translateY(-1px);
  }
  body a.btn:active {
    transform: translateY(1px);
  }

  @media (max-width: 1350px) {
    .lateral { position: static; width: auto; padding: 0; }
  }
</style>

<aside class="lateral izq">{% include planificacion.html %}</aside>
<aside class="lateral der">{% include patrones.html %}</aside>
{{ content }}
